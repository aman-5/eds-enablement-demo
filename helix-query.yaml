# Query-index definition for the WKND site.
#
# SOURCE OF TRUTH: the LIVE index configuration lives at tools.aem.live. This
# file is committed to VERSION and DOCUMENT that definition alongside the code
# that depends on it — it is the canonical, reviewable reference, not (by
# itself) the runtime config. Keep the two in sync: any column change made at
# tools.aem.live must be mirrored here in the same PR.
#
# Consumed by the dynamic cards-article variant (blocks/cards-article), which
# fetches /query-index.json and filters client-side by path prefix (source) and
# optionally by activity, sorts newest-first (lastModified), and caps by limit:
#   - home "Recent Articles" rail      (source /us/en/magazine/)
#   - home "Where do you want to go?"   (source /us/en/adventures/)
#   - /us/en/magazine listing           (source /us/en/magazine/)
#   - /us/en/adventures listing         (source /us/en/adventures/, activity tabs)
#   - detail-page "related" rails       (same activity, current page excluded)
version: 1

indices:
  default:
    include:
      - '/us/en/**'
    exclude:
      - '/us/en/drafts/**'
      - '/tools/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      date:
        select: head > meta[name="date"]
        value: attribute(el, 'content')
      activity:
        select: head > meta[name="activity"]
        value: attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers('last-modified'), 'EEE, dd MMM yyyy HH:mm:ss zzz')
